# Configuração do cargo-deny (https://embarkstudios.github.io/cargo-deny/).
#
# O DBeas é distribuído sob GPL-3.0-or-later. Esta configuração garante que
# nenhuma dependência (direta ou indireta) tenha licença incompatível, além de
# checar avisos de segurança, crates banidos e origens dos pacotes.
#
# Uso: cargo deny check
# Detalhes e motivos: ai-content/knowledge-base/arquitetura/licencas.md

[graph]
all-features = false

[advisories]
version = 2
# Avisos de segurança do RustSec bloqueiam; crates retirados (yanked) só alertam.
yanked = "warn"
# Exceções revisadas em 2026-10-09: avisos de "sem manutenção" (não são
# vulnerabilidades) em dependências transitivas do Iced, que o DBeas não
# controla. Revisar ao atualizar o Iced; qualquer outro aviso continua falhando.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode sem manutenção; vem de syntect via iced_highlighter (realce do editor)" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust sem manutenção; vem de syntect via iced_highlighter (realce do editor)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser sem manutenção; vem de cosmic-text/fontdb (renderização de texto do Iced)" },
    { id = "RUSTSEC-2024-0436", reason = "paste sem manutenção; macro de compilação usada por metal/wgpu-hal (backend gráfico do Iced no macOS)" },
]

[licenses]
version = 2
# Licenças compatíveis com GPL-3.0-or-later. Licenças duplas (ex.: "MIT OR
# Apache-2.0") passam quando ao menos uma opção está na lista.
#
# Fora da lista de propósito:
# - GPL-2.0-only: incompatível com Apache-2.0 (usada por várias dependências).
# - Licenças proprietárias ou "não comerciais".
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    # Compatível com GPL-3.0 pela cláusula de "Secondary License" da MPL 2.0.
    "MPL-2.0",
]
confidence-threshold = 0.93

[licenses.private]
# O próprio crate (publish = false) não precisa estar na lista.
ignore = true

[bans]
# Versões duplicadas são comuns no ecossistema de GUI (wgpu/winit); só alerta.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
