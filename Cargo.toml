[package]
name = "dbeas"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["tokio", "highlighter", "advanced"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-postgres = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
sqlparser = "0.63"
dirs = "6"
thiserror = "2"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
chrono = "0.4"
postgres-protocol = "0.6"
fallible-iterator = "0.2"
futures-util = "0.3"
pg_query = "6"
trash = "5"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
