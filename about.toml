# Configuração do cargo-about (https://embarkstudios.github.io/cargo-about/).
#
# Gera THIRD_PARTY_LICENSES.html com o texto das licenças de todas as
# dependências, exigido ao distribuir binários do DBeas (GPL-3.0-or-later).
#
# Uso: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html
# Mantenha a lista em sincronia com deny.toml.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
]

# Ferramentas de teste não são distribuídas.
ignore-dev-dependencies = true
ignore-build-dependencies = false
# O próprio DBeas não entra na lista de terceiros.
private = { ignore = true }
